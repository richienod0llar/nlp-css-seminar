llm:
  base_url: "http://localhost:8000/v1"
  model: "/dss/dssmcmlfs01/pn25ju/pn25ju-dss-0000/models/Qwen3.5-9B"
  api_key: "EMPTY"
  max_tokens: 1024
  temperature: 0.0
  enable_thinking: false  # required for Qwen3.5 JSON output with guided_json
  mock: false

judge:
  model: "/dss/dssmcmlfs01/pn25ju/pn25ju-dss-0000/models/Qwen3-32B"
  base_url: "http://localhost:8001/v1"  # external judge (start_vllm_judge.sh, 2 GPUs)
  max_tokens: 256
  temperature: 0.0
  enable_thinking: false  # Qwen3 family: /no_think + chat_template_kwargs are honoured (were inert on the 72B)

data:
  gold_set: "data/gold_set.xlsx"
  concepts: "data/concepts.yaml"

output:
  dir: "outputs/"

eval:
  max_rows: null  # null = all 115 rows; set e.g. 5 for a quick test
  output_dir: "outputs/"
  run_judge: false  # full eval judge; prefer scripts/run_judge_only.py for the external 32B
